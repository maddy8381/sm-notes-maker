name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # A throwaway Postgres, so the suite never needs credentials for a real
      # database and cannot reach one by accident.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sm_notes_maker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sm_notes_maker_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sm_notes_maker_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sm_notes_maker_test
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      AUTH_SECRET: ci-secret-at-least-32-characters-long-000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      - run: npm test

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
